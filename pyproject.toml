[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tidal_to_applemusic_KNatzev"]

[project]
name = "tidal_to_applemusic_KNatzev"
version = "0.0.1"
authors = [
  { name="KNatzev", email="kaloyan.natzev@gmail.com" },
]
description = "App that transfers Tidal playlists to Apple Music"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/Programming-The-Next-Step-2026/tidal-to-applemusic"
Issues = "https://github.com/Programming-The-Next-Step-2026/tidal-to-applemusic/issues"